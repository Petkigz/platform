# The one migration after the 368, on the AyahSpring test project only:
# 20261281162000_provider_events.sql (somewhere to write down what a mail
# provider says happened to a message: one table, a few columns on
# outbound_messages, two functions). One-time:
# scripts/hosted-migration-369.mjs refuses unless the hosted history is
# exactly the 368 and the local files are exactly the reviewed 369.
#
# NOBODY HAS ASKED FOR THIS STEP YET. It starts only on a commit whose
# message begins with the words in the `if` below, which is pushed only on
# the owner's word; the environment then still requires the owner's approval
# before the job, and so before any secret, is released.
#
# The job checks out the commit this step was reviewed at (45422cb, which
# holds exactly the 369) and runs that tree's script, test and migrations, so
# a migration added later cannot reach the hosted project through it.
name: Apply Supabase test migration 369
on:
  push:
    branches:
      - arena/4f30fd1d-platform
permissions:
  contents: read
# A group of its own, as the ones before it had: every push starts every one
# of these workflows (each then skips), and GitHub keeps one run waiting in a
# group and cancels the rest. The script refuses unless the hosted history is
# exactly the 358.
concurrency:
  group: ayahspring-supabase-test-migration-369
  cancel-in-progress: false
jobs:
  apply-369:
    if: >-
      github.repository == 'Petkigz/platform' && github.ref == 'refs/heads/arena/4f30fd1d-platform' && startsWith(github.event.head_commit.message, 'test: apply ayahspring test migration 369')
    runs-on: ubuntu-latest
    environment: ayahspring-test-migration-apply
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The tree with exactly the 369 migrations this step was reviewed for.
          ref: 45422cbcd0f7fb1e6f8d36be318ec2cf764f881a
          persist-credentials: false
      - name: The tree is the one reviewed, with 369 migrations and no more
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '45422cbcd0f7fb1e6f8d36be318ec2cf764f881a'
          test "$(ls supabase/migrations/*.sql | wc -l)" = '369'
          test "$(ls supabase/migrations/*.sql | tail -1)" = 'supabase/migrations/20261281162000_provider_events.sql'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.3'
      # Everything below this comment and above the last step runs without the
      # database secret.
      - name: Install reviewed dependencies and CLI
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/ayahspring-cli" --no-save --no-audit --no-fund supabase@3.1.0
          test "$("$RUNNER_TEMP/ayahspring-cli/node_modules/.bin/supabase" --version)" = '3.1.0'
      - name: The plan, against the real migrations in a local engine
        run: node --test scripts/hosted-migration-369.test.mjs
      - name: What the tested database gives anon and authenticated
        run: node scripts/api-role-privileges.mjs --write "$RUNNER_TEMP/expected-privileges.json"
      - name: Check, rehearse on the test project, apply the one, compare
        run: node scripts/hosted-migration-369.mjs
        env:
          SUPABASE_CLI_BIN: ${{ runner.temp }}/ayahspring-cli/node_modules/.bin/supabase
          AYAHSPRING_EXPECTED_PRIVILEGES: ${{ runner.temp }}/expected-privileges.json
          AYAHSPRING_TEST_DATABASE_URL: ${{ secrets.AYAHSPRING_TEST_DATABASE_URL }}
          AYAHSPRING_TEST_DATABASE_PASSWORD: ${{ secrets.AYAHSPRING_TEST_DATABASE_PASSWORD }}
          AYAHSPRING_TEST_APPLY_READY: ${{ vars.AYAHSPRING_TEST_APPLY_READY }}
