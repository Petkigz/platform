name: Responsive browser smoke
on:
  push:
    branches:
      - arena/4f30fd1d-platform
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: responsive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/responsive" --no-audit --no-fund playwright-core@1.58.2
      - name: Check wide and narrow viewports in English and Arabic
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          node scripts/responsive-smoke.mjs
      - name: Check audio resume in competing tabs with synthetic data
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          if node scripts/media-resume-browser-smoke.mjs > "$RUNNER_TEMP/media-resume-browser.log" 2>&1; then
            cat "$RUNNER_TEMP/media-resume-browser.log"
          else
            cat "$RUNNER_TEMP/media-resume-browser.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-5000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Media resume browser test::${s}`)' "$RUNNER_TEMP/media-resume-browser.log"
            exit 1
          fi
      - name: Check populated catalogue layouts and search with synthetic data
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          node scripts/catalogue-route-smoke.mjs
      - name: Check learner dashboard layouts with synthetic data
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          if node scripts/learner-dashboard-route-smoke.mjs > "$RUNNER_TEMP/learner-responsive.log" 2>&1; then
            cat "$RUNNER_TEMP/learner-responsive.log"
          else
            cat "$RUNNER_TEMP/learner-responsive.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-5000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Learner responsive test::${s}`)' "$RUNNER_TEMP/learner-responsive.log"
            exit 1
          fi
      - name: Check the account page and its profile form with synthetic data
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          if node scripts/account-route-smoke.mjs > "$RUNNER_TEMP/account-responsive.log" 2>&1; then
            cat "$RUNNER_TEMP/account-responsive.log"
          else
            cat "$RUNNER_TEMP/account-responsive.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-5000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Account responsive test::${s}`)' "$RUNNER_TEMP/account-responsive.log"
            exit 1
          fi
      - name: Check the family pages and their three forms with synthetic data
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          if node scripts/family-route-smoke.mjs > "$RUNNER_TEMP/family-responsive.log" 2>&1; then
            cat "$RUNNER_TEMP/family-responsive.log"
          else
            cat "$RUNNER_TEMP/family-responsive.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-5000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Family responsive test::${s}`)' "$RUNNER_TEMP/family-responsive.log"
            exit 1
          fi

      - name: Check the buy page and its form with synthetic data and a synthetic provider
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          if node scripts/buy-route-smoke.mjs > "$RUNNER_TEMP/buy-responsive.log" 2>&1; then
            cat "$RUNNER_TEMP/buy-responsive.log"
          else
            cat "$RUNNER_TEMP/buy-responsive.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-5000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Buy responsive test::${s}`)' "$RUNNER_TEMP/buy-responsive.log"
            exit 1
          fi
      - name: Check the closing-account page and its form with synthetic data
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          if node scripts/close-route-smoke.mjs > "$RUNNER_TEMP/close-responsive.log" 2>&1; then
            cat "$RUNNER_TEMP/close-responsive.log"
          else
            cat "$RUNNER_TEMP/close-responsive.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-5000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Closing-account responsive test::${s}`)' "$RUNNER_TEMP/close-responsive.log"
            exit 1
          fi
      - name: Check the export pages, their buttons and the print stylesheet with synthetic data
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          if node scripts/export-route-smoke.mjs > "$RUNNER_TEMP/export-responsive.log" 2>&1; then
            cat "$RUNNER_TEMP/export-responsive.log"
          else
            cat "$RUNNER_TEMP/export-responsive.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-5000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Export responsive test::${s}`)' "$RUNNER_TEMP/export-responsive.log"
            exit 1
          fi
      - name: Check the reading settings, the skip link and a browser that keeps no cookie
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          if node scripts/reading-route-smoke.mjs > "$RUNNER_TEMP/reading-responsive.log" 2>&1; then
            cat "$RUNNER_TEMP/reading-responsive.log"
          else
            cat "$RUNNER_TEMP/reading-responsive.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-5000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Reading settings responsive test::${s}`)' "$RUNNER_TEMP/reading-responsive.log"
            exit 1
          fi
      - name: Check putting a copy back, a wrong file, the check before the write and a write nobody answered
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          if node scripts/restore-route-smoke.mjs > "$RUNNER_TEMP/restore-responsive.log" 2>&1; then
            cat "$RUNNER_TEMP/restore-responsive.log"
          else
            cat "$RUNNER_TEMP/restore-responsive.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-5000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Restore responsive test::${s}`)' "$RUNNER_TEMP/restore-responsive.log"
            exit 1
          fi
      - name: Check lesson and video layout with synthetic data
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          if node scripts/lesson-route-smoke.mjs > "$RUNNER_TEMP/lesson-responsive.log" 2>&1; then
            cat "$RUNNER_TEMP/lesson-responsive.log"
          else
            cat "$RUNNER_TEMP/lesson-responsive.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-5000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Lesson responsive test::${s}`)' "$RUNNER_TEMP/lesson-responsive.log"
            exit 1
          fi
      - name: Check enrolled course layout with synthetic data
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          if node scripts/course-workspace-route-smoke.mjs > "$RUNNER_TEMP/course-responsive.log" 2>&1; then
            cat "$RUNNER_TEMP/course-responsive.log"
          else
            cat "$RUNNER_TEMP/course-responsive.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-5000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Course responsive test::${s}`)' "$RUNNER_TEMP/course-responsive.log"
            exit 1
          fi
  # The companion tools in their own job: a real browser's zone, location
  # prompt, storage and clock, in four languages. Kept apart from the job above
  # so neither spends the other's ten minutes, and so the screenshots are kept
  # whether or not an assertion failed.
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/responsive" --no-audit --no-fund playwright-core@1.58.2
      - name: Install fonts for Arabic, Tamil, Burmese and Thaana so measured widths are real glyphs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-core
          fc-list | grep -ci -E 'myanmar|arabic|tamil|thaana'
      - name: Prayer times, Hijri date and counter in Chromium with synthetic data
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
          RESPONSIVE_SCREENSHOTS: ${{ runner.temp }}/companion-screenshots
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          if node scripts/companion-browser-smoke.mjs > "$RUNNER_TEMP/companion-browser.log" 2>&1; then
            cat "$RUNNER_TEMP/companion-browser.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").split("\n").filter(l=>/^(Manual entry|Device location|After-midnight|Layout|Hijri [a-z]+:|Held for review|Withheld)/.test(l)).map(l=>l.slice(0,400)).join("\n").replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::notice title=Companion browser test::${s}`)' "$RUNNER_TEMP/companion-browser.log"
          else
            cat "$RUNNER_TEMP/companion-browser.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-5000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Companion browser test::${s}`)' "$RUNNER_TEMP/companion-browser.log"
            exit 1
          fi
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: companion-screenshots
          path: ${{ runner.temp }}/companion-screenshots
          if-no-files-found: ignore
          retention-days: 7
  # Every static route at a phone's width and a desk's: no sideways scroll and
  # nothing touching the edge of the screen. Its own job because it compiles
  # every page in `next dev`, which is slow and unrelated to the checks above.
  edges:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/responsive" --no-audit --no-fund playwright-core@1.58.2
      - name: Sweep every static route for sideways scroll and edge-touching content
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          if node scripts/edge-sweep.mjs > "$RUNNER_TEMP/edge-sweep.log" 2>&1; then
            cat "$RUNNER_TEMP/edge-sweep.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").trim().split("\n").pop().replaceAll("%","%25");console.log(`::notice title=Edge sweep::${s}`)' "$RUNNER_TEMP/edge-sweep.log"
          else
            cat "$RUNNER_TEMP/edge-sweep.log"
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-5000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Edge sweep::${s}`)' "$RUNNER_TEMP/edge-sweep.log"
            exit 1
          fi
