name: Responsive browser smoke
on:
  push:
    branches:
      - arena/4f30fd1d-platform
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: responsive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/responsive" --no-audit --no-fund playwright-core@1.58.2
      - name: Check wide and narrow viewports in English and Arabic
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          node scripts/responsive-smoke.mjs
      - name: Check populated catalogue layouts and search with synthetic data
        env:
          RESPONSIVE_PLAYWRIGHT: ${{ runner.temp }}/responsive/node_modules/playwright-core/index.mjs
        run: |
          set -euo pipefail
          export RESPONSIVE_CHROME="$(command -v google-chrome || command -v chromium)"
          node scripts/catalogue-route-smoke.mjs
