# The gates that used to be run by hand at the end of every work session.
#
# They are here because the person building this works with an AI assistant in
# sessions that end and restart, and a gate that lives only in somebody's memory
# of the last session is a gate that gets skipped. Nothing in this file deploys
# anything or holds a secret: database suites run against PGlite in memory, and
# the web build succeeds with no Supabase credentials configured at all.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A solo builder pushes often; a superseded run on the same branch is wasted
# minutes rather than lost information.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Node builtins only, so there is nothing to install before this runs.
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.3'
      - run: node scripts/repo-check.mjs
      - run: node scripts/cloudflare-probe-lock/check.mjs
      - run: node --test scripts/cloudflare-probe-lock/preview-gate.test.mjs scripts/cloudflare-probe-lock/preview-label.test.mjs scripts/cloudflare-probe-lock/deploy-guard.test.mjs scripts/cloudflare-probe-lock/reviewer-guard.test.mjs scripts/db-suite-watchdog.test.mjs

  database:
    name: Full database suite
    runs-on: ubuntu-latest
    # A stalled in-memory run must report a failure instead of consuming a
    # runner indefinitely. The independent web job can still provide feedback.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - name: Same privileges with and without the hosted platform's defaults
        run: node scripts/platform-grants-check.mjs
      - name: Schema snapshot the web select check reads is current
        run: node scripts/postgrest-schema-snapshot.mjs --check
      - name: Run all registered database suites together
        run: node scripts/db-suite-watchdog.mjs

  gates:
    name: Web, routes, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          # Pinned to the version the suite was verified against. Bumping it is
          # a deliberate act, not something a runner image decides.
          node-version: '22.22.3'
          cache: npm
      - run: npm ci

      - name: Migration preview and apply guard tests
        run: node --test scripts/hosted-migration-dry-run.test.mjs scripts/hosted-migration-apply.test.mjs

      - name: Prayer component simulation
        run: npm run test:prayer-component

      - name: Progress control component simulation
        run: node scripts/mark-complete-component-test.mjs

      - name: Media position component simulation
        run: node scripts/media-position-component-test.mjs

      - name: Resource media position component simulation
        run: node scripts/media-resource-position-component-test.mjs

      - name: Earlier lesson-wide place simulation
        run: node scripts/media-legacy-position-component-test.mjs

      - name: Earlier lesson-wide recovery simulation
        run: node scripts/media-legacy-recovery-component-test.mjs

      - name: Conflict-aware position route simulation
        run: node scripts/media-position-v2-route-test.mjs

      - name: Resource-scoped position route simulation
        run: node scripts/media-position-v3-route-test.mjs

      - name: Legacy position route regression
        run: node scripts/legacy-position-route-test.mjs

      - name: Redirect route HTTP regression
        run: node scripts/redirect-route-smoke.mjs

      - name: Learner dashboard synthetic HTTP regression
        run: node scripts/learner-dashboard-route-smoke.mjs

      - name: Catalogue synthetic HTTP regression
        run: node scripts/catalogue-route-smoke.mjs

      - name: Lesson synthetic HTTP regression
        run: node scripts/lesson-route-smoke.mjs

      - name: Enrolled-course synthetic HTTP regression
        run: node scripts/course-workspace-route-smoke.mjs

      - name: Web unit suite
        run: npm run test:web

      - name: Focused code lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: No translation catalogue in what the browser downloads
        run: node scripts/client-bundle-check.mjs
