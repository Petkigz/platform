# One-off preview ONLY. This workflow does not have an apply job.
# GitHub environments do not automatically require approval: configure required
# reviewers in the repository UI before creating the secret or readiness variable.
name: Supabase test migration dry-run
on:
  push:
    branches:
      - arena/4f30fd1d-platform
permissions:
  contents: read
concurrency:
  group: ayahspring-supabase-test-preview
  cancel-in-progress: false
jobs:
  preview:
    if: >-
      github.repository == 'Petkigz/platform' && github.ref == 'refs/heads/arena/4f30fd1d-platform' && startsWith(github.event.head_commit.message, 'test: preview ayahspring test migrations')
    runs-on: ubuntu-latest
    environment: ayahspring-test-dry-run
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.3'
      # Install before exposing the database secret to any process.
      - name: Install the tested CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/ayahspring-cli" --no-save --no-audit --no-fund supabase@3.1.0
          test "$("$RUNNER_TEMP/ayahspring-cli/node_modules/.bin/supabase" --version)" = '3.1.0'
      - name: Preview pending migrations without applying
        run: node scripts/hosted-migration-dry-run.mjs
        env:
          SUPABASE_CLI_BIN: ${{ runner.temp }}/ayahspring-cli/node_modules/.bin/supabase
          AYAHSPRING_TEST_DATABASE_URL: ${{ secrets.AYAHSPRING_TEST_DATABASE_URL }}
          AYAHSPRING_TEST_DATABASE_PASSWORD: ${{ secrets.AYAHSPRING_TEST_DATABASE_PASSWORD }}
          AYAHSPRING_TEST_DRY_RUN_READY: ${{ vars.AYAHSPRING_TEST_DRY_RUN_READY }}
