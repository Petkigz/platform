# One-off compatibility experiment: no Cloudflare credentials, bindings to
# hosted resources, uploads, deployments, application secrets or real data.
name: Cloudflare local compatibility probe
on:
  push:
    branches:
      - arena/4f30fd1d-platform
permissions:
  contents: read
jobs:
  probe:
    if: >-
      github.repository == 'Petkigz/platform' && github.ref == 'refs/heads/arena/4f30fd1d-platform' && startsWith(github.event.head_commit.message, 'test: local cloudflare compatibility probe')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      NEXT_PUBLIC_ALLOW_MISSING_SUPABASE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.3'
      - name: Prepare isolated copy and experimental dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ayah-probe"
          node scripts/cloudflare-probe-lock/check.mjs
          cp scripts/cloudflare-probe-lock/package.json scripts/cloudflare-probe-lock/package-lock.json "$RUNNER_TEMP/ayah-probe/"
          cp -a web "$RUNNER_TEMP/ayah-probe/web"
          cp scripts/cloudflare-probe-lock/web-package.json "$RUNNER_TEMP/ayah-probe/web/package.json"
          cp scripts/cloudflare-local-probe.mjs scripts/cloudflare-prayer-synthetic.mjs "$RUNNER_TEMP/ayah-probe/"
          cd "$RUNNER_TEMP/ayah-probe"
          npm ci --no-audit --no-fund
          npm audit --json > audit.json || true
          node -e 'const a=require("./audit.json"); if(!a.metadata?.vulnerabilities) throw Error("audit result unavailable"); const summary=JSON.stringify(a.metadata.vulnerabilities); const names=Object.entries(a.vulnerabilities||{}).map(([n,v])=>`${n}:${v.severity}`).join(", "); console.log(`::notice title=Experimental dependency audit::${summary} ${names}`); if(a.metadata.vulnerabilities.total !== 0) throw Error("Review experimental dependency advisories before proceeding");'
          cat > web/wrangler.jsonc <<'EOF'
          {
            "name": "ayahspring-local-probe",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-10-15",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "assets": {"directory": ".open-next/assets", "binding": "ASSETS"},
            "services": [{"binding": "WORKER_SELF_REFERENCE", "service": "ayahspring-local-probe"}],
            "images": {"binding": "IMAGES"}
          }
          EOF
          cat > web/open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from '@opennextjs/cloudflare';
          export default defineCloudflareConfig();
          EOF
      - name: Build locally without deploying
        working-directory: ${{ runner.temp }}/ayah-probe/web
        run: npx --no-install opennextjs-cloudflare build
      - name: Measure bundle with Wrangler dry-run only
        working-directory: ${{ runner.temp }}/ayah-probe/web
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/ayah-worker-bundle" 2>&1 | tee "$RUNNER_TEMP/bundle.log"
          node -e 'const fs=require("fs");const s=fs.readFileSync(process.env.RUNNER_TEMP+"/bundle.log","utf8").replace(/\x1b\[[0-9;]*m/g,"");const line=s.split("\n").find(x=>x.includes("Total Upload:"));if(!line) throw Error("Bundle size was not reported");console.log(`::notice title=Local dry-run bundle size::${line.trim()}`);'
      - name: Test local Workers runtime without hosted services
        working-directory: ${{ runner.temp }}/ayah-probe
        shell: bash
        run: |
          if node cloudflare-local-probe.mjs > probe.log 2>&1; then
            cat probe.log
          else
            cat probe.log
            node -e 'const s=require("fs").readFileSync("probe.log","utf8").slice(-6000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A"); console.log(`::error title=Local Workers probe failed::${s}`)'
            exit 1
          fi
      # Rebuild with a fake loopback target baked in; no real credentials or data.
      - name: Build for synthetic prayer test
        working-directory: ${{ runner.temp }}/ayah-probe/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:34567
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fake-anon
        run: npx --no-install opennextjs-cloudflare build
      - name: Test prayer route with synthetic loopback services
        working-directory: ${{ runner.temp }}/ayah-probe
        shell: bash
        run: |
          if node cloudflare-prayer-synthetic.mjs > prayer-probe.log 2>&1; then
            cat prayer-probe.log
          else
            cat prayer-probe.log
            node -e 'const s=require("fs").readFileSync("prayer-probe.log","utf8").slice(-6000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A"); console.log(`::error title=Synthetic prayer probe failed::${s}`)'
            exit 1
          fi
