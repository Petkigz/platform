# A copy of the AyahSpring test project's database and a rehearsal of putting
# it back, on a scratch database that lives and dies on the runner. The free
# tier keeps no backups; this is the copy.
#
# It only reads the project: one READ ONLY transaction and pg_dump. It writes
# to nothing but the runner. scripts/hosted-backup.mjs says what it measures,
# what it compares and what it cannot do.
#
# How it starts:
#   * a push to the working branch whose commit message begins
#     "test: back up ayahspring test project" (unlike the migration jobs this
#     one may be run as often as wanted: it changes nothing);
#   * by hand, from the Actions page;
#   * every Sunday, once the repository variable AYAHSPRING_BACKUP_SCHEDULE is
#     "yes". GitHub runs a schedule only from the default branch, so that
#     starts when this file is on `main`.
#
# The environment requires the owner's approval before the job, and so before
# any secret, is released. A weekly run therefore waits for a click each week,
# for as long as the environment has a required reviewer.
#
# What is kept: only if the environment has the secret
# AYAHSPRING_BACKUP_PASSPHRASE (twenty characters or more), one encrypted file
# as the run's artifact, for 90 days. This repository is public and so are its
# artifacts: the plain copy never leaves the runner. Without the secret the
# run still takes the copy, puts it back and compares, and keeps nothing.
name: Back up the Supabase test project and rehearse a restore
on:
  push:
    branches:
      - arena/4f30fd1d-platform
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
permissions:
  contents: read
concurrency:
  group: ayahspring-supabase-test-backup
  cancel-in-progress: false
jobs:
  backup:
    if: >-
      github.repository == 'Petkigz/platform' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/arena/4f30fd1d-platform' && startsWith(github.event.head_commit.message, 'test: back up ayahspring test project')) ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && vars.AYAHSPRING_BACKUP_SCHEDULE == 'yes')
      )
    runs-on: ubuntu-latest
    environment: ayahspring-test-dry-run
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.3'
      # Everything below this comment and above the copy runs without a secret.
      - name: Install reviewed dependencies and CLI
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/ayahspring-cli" --no-save --no-audit --no-fund supabase@3.1.0
          test "$("$RUNNER_TEMP/ayahspring-cli/node_modules/.bin/supabase" --version)" = '3.1.0'
      - name: The measure and the comparison, against a local engine
        run: node --test scripts/hosted-backup.test.mjs
      - name: Start an empty scratch database that has never seen the project
        id: scratch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scratch/supabase"
          cd "$RUNNER_TEMP/scratch"
          # The project runs PostgreSQL 17; the scratch one must be the same major version.
          printf 'project_id = "ayahspring-restore"\n\n[db]\nmajor_version = 17\n' > supabase/config.toml
          if "$RUNNER_TEMP/ayahspring-cli/node_modules/.bin/supabase" start > "$RUNNER_TEMP/scratch.log" 2>&1; then
            echo 'The scratch stack is up.'
          else
            # Only a local stack's own output: no secret has been released to this step.
            node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8").slice(-3000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log(`::error title=Scratch database::${s}`)' "$RUNNER_TEMP/scratch.log"
            exit 1
          fi
          container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$container"
          echo "container=$container" >> "$GITHUB_OUTPUT"
          # Empty: nothing of the platform's is in it before the copy goes in.
          test "$(docker exec -e PGPASSWORD=postgres "$container" psql -h 127.0.0.1 -U postgres -d postgres -Atc "select count(*) from pg_tables where schemaname = 'public'")" = '0'
      - name: Copy the project, put the copy back into the scratch database, compare
        id: copy
        run: node scripts/hosted-backup.mjs
        env:
          SUPABASE_CLI_BIN: ${{ runner.temp }}/ayahspring-cli/node_modules/.bin/supabase
          AYAHSPRING_BACKUP_DIR: ${{ runner.temp }}/backup
          AYAHSPRING_SCRATCH_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          AYAHSPRING_SCRATCH_CONTAINER: ${{ steps.scratch.outputs.container }}
          AYAHSPRING_TEST_DATABASE_URL: ${{ secrets.AYAHSPRING_TEST_DATABASE_URL }}
          AYAHSPRING_TEST_DATABASE_PASSWORD: ${{ secrets.AYAHSPRING_TEST_DATABASE_PASSWORD }}
          AYAHSPRING_BACKUP_PASSPHRASE: ${{ secrets.AYAHSPRING_BACKUP_PASSPHRASE }}
      - name: Keep the encrypted copy, and only that
        # always(): a copy whose rehearsal failed is kept too (named UNPROVEN),
        # and the step before it is red in that case.
        if: ${{ always() && steps.copy.outputs.encrypted != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ayahspring-backup-${{ github.run_id }}
          path: ${{ steps.copy.outputs.encrypted }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      - name: Remove the plain copy and the scratch database
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP/backup"
          cd "$RUNNER_TEMP/scratch" 2>/dev/null && "$RUNNER_TEMP/ayahspring-cli/node_modules/.bin/supabase" stop --no-backup > /dev/null 2>&1 || true
